  <rect x="510" y="422" width="220" height="38" rx="19" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <text x="620" y="447" font-size="16" fill="#585963" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">L-2402 · 08/2027</text>
  <text x="940" y="450" font-size="20" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">17.30</text>
  <path d="M120 484 H960" stroke="#E4DCCF" stroke-width="2"/>

  <!-- Lote vencido excluido -->
  <rect x="124" y="508" width="230" height="16" rx="8" fill="#D8D0C2"/>
  <rect x="510" y="502" width="220" height="38" rx="19" fill="#FFFFFF" stroke="#D8D0C2" stroke-dasharray="6 6" stroke-width="2"/>
  <text x="620" y="527" font-size="16" fill="#585963" text-anchor="middle" text-decoration="line-through" font-family="'Geist Mono', Consolas, monospace">L-2209 · 09/2026</text>
