name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido pagar por comprobar un commit ya sustituido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · tipos · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        # El build no necesita las claves reales: sin ellas las métricas en vivo
        # caen en sus valores de reserva, que es justo lo que hay que comprobar
        # que sigue funcionando.
        run: npm run build
