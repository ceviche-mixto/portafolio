  <text x="130" y="630" font-size="15" fill="#585963" letter-spacing="2" font-family="'Geist Mono', Consolas, monospace">TRACE</text>

  <rect x="130" y="660" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#253BD6" stroke-width="2"/>
  <text x="240" y="700" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">L-2405</text>
  <text x="240" y="730" font-size="16" fill="#585963" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">−20 u</text>

  <path d="M352 708 H436" stroke="#253BD6" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="440" y="660" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <text x="550" y="700" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">B001</text>
  <text x="550" y="730" font-size="16" fill="#585963" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">000123</text>

  <path d="M662 708 H746" stroke="#253BD6" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="750" y="660" width="196" height="96" rx="12" fill="#ECA888"/>
  <text x="848" y="700" font-size="20" font-weight="700" fill="#15171C" text-anchor="middle">UBL 2.1</text>
  <text x="848" y="730" font-size="16" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">CDR ✓</text>

  <!-- Reversión a su lote de origen -->
  <path d="M550 760 C550 840, 240 840, 240 762" fill="none" stroke="#585963" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-ink)"/>
  <rect x="352" y="812" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <text x="412" y="838" font-size="16" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">NC · BC01</text>

