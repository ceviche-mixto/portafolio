<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Geist, 'Segoe UI', Arial, sans-serif">
  <title>FARMAPLUS: punto de venta con lote FEFO, comprobante por serie y arqueo de caja (esquema con datos ficticios)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#253BD6"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#585963"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#F5F0E8"/>

  <!-- Ventana del POS -->
  <rect x="80" y="70" width="1440" height="860" rx="20" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <path d="M80 140 H1520" stroke="#E4DCCF" stroke-width="2"/>
  <circle cx="122" cy="105" r="7" fill="#E4DCCF"/>
  <circle cx="146" cy="105" r="7" fill="#E4DCCF"/>
  <circle cx="170" cy="105" r="7" fill="#E4DCCF"/>
  <text x="210" y="112" font-size="20" font-weight="700" fill="#15171C" letter-spacing="1">FARMAPLUS · POS</text>
  <rect x="1310" y="88" width="180" height="34" rx="17" fill="#F5F0E8" stroke="#D8D0C2"/>
  <text x="1400" y="111" font-size="16" fill="#585963" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">F4 · F8</text>

  <!-- Carrito -->
  <text x="120" y="190" font-size="15" fill="#585963" letter-spacing="2" font-family="'Geist Mono', Consolas, monospace">SKU</text>
  <text x="520" y="190" font-size="15" fill="#585963" letter-spacing="2" font-family="'Geist Mono', Consolas, monospace">LOTE · EXP</text>
  <text x="940" y="190" font-size="15" fill="#585963" letter-spacing="2" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">S/</text>
  <path d="M120 206 H960" stroke="#E4DCCF" stroke-width="2"/>

  <!-- Línea 1: lote FEFO destacado -->
  <rect x="104" y="222" width="872" height="82" rx="12" fill="#F5F0E8" stroke="#253BD6" stroke-width="2"/>
  <rect x="124" y="242" width="250" height="16" rx="8" fill="#15171C"/>
  <rect x="124" y="270" width="150" height="12" rx="6" fill="#D8D0C2"/>
  <text x="400" y="272" font-size="18" fill="#15171C" font-family="'Geist Mono', Consolas, monospace">2 × 10</text>
  <rect x="510" y="244" width="220" height="38" rx="19" fill="#FFFFFF" stroke="#253BD6" stroke-width="2"/>
  <text x="620" y="269" font-size="16" fill="#253BD6" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">L-2405 · 03/2027</text>
  <rect x="744" y="246" width="72" height="34" rx="8" fill="#253BD6"/>
  <text x="780" y="269" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">FEFO</text>
  <text x="940" y="272" font-size="20" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">12.40</text>

  <!-- Línea 2 -->
  <rect x="124" y="332" width="210" height="16" rx="8" fill="#15171C"/>
  <rect x="124" y="360" width="120" height="12" rx="6" fill="#D8D0C2"/>
