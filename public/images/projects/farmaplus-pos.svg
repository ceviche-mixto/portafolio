  <text x="940" y="362" font-size="20" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">18.90</text>
  <path d="M120 396 H960" stroke="#E4DCCF" stroke-width="2"/>

  <!-- Línea 3 -->
  <rect x="124" y="420" width="280" height="16" rx="8" fill="#15171C"/>
  <rect x="124" y="448" width="170" height="12" rx="6" fill="#D8D0C2"/>
