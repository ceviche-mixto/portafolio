  <rect x="1010" y="170" width="470" height="410" rx="16" fill="#F5F0E8" stroke="#E4DCCF" stroke-width="2"/>
  <text x="1040" y="220" font-size="18" fill="#585963">Subtotal</text>
  <text x="1450" y="220" font-size="20" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">41.19</text>
  <text x="1040" y="262" font-size="18" fill="#585963">IGV 18%</text>
  <text x="1450" y="262" font-size="20" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">7.41</text>
  <path d="M1040 290 H1450" stroke="#D8D0C2" stroke-width="2"/>
  <text x="1040" y="350" font-size="22" font-weight="700" fill="#15171C">Total</text>
  <text x="1450" y="356" font-size="44" font-weight="800" fill="#15171C" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">S/ 48.60</text>
  <rect x="1040" y="400" width="410" height="64" rx="32" fill="#253BD6"/>
  <text x="1245" y="441" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">F4</text>
  <rect x="1040" y="484" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <text x="1138" y="524" font-size="20" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">S/ 50.00</text>
  <rect x="1254" y="484" width="196" height="64" rx="12" fill="#FFFFFF" stroke="#D8D0C2" stroke-width="2"/>
  <text x="1352" y="524" font-size="20" fill="#15171C" text-anchor="middle" font-family="'Geist Mono', Consolas, monospace">↩ 1.40</text>

  <!-- Arqueo: sólo efectivo -->
  <rect x="1010" y="610" width="470" height="280" rx="16" fill="#15171C"/>
  <text x="1040" y="652" font-size="15" fill="#A9A69F" letter-spacing="2" font-family="'Geist Mono', Consolas, monospace">CASH · Δ</text>
  <rect x="1040" y="676" width="190" height="110" rx="10" fill="none" stroke="#3A3D46" stroke-width="2"/>
  <rect x="1060" y="700" width="150" height="18" rx="4" fill="#3A3D46"/>
  <rect x="1060" y="730" width="150" height="18" rx="4" fill="#3A3D46"/>
  <rect x="1060" y="760" width="100" height="10" rx="4" fill="#3A3D46"/>
  <text x="1450" y="728" font-size="22" fill="#F5F0E8" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">S/ 1,284.50</text>
  <text x="1450" y="770" font-size="22" fill="#F5F0E8" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">S/ 1,284.50</text>
  <path d="M1250 794 H1450" stroke="#3A3D46" stroke-width="2"/>
  <text x="1450" y="846" font-size="40" font-weight="800" fill="#8FA0FF" text-anchor="end" font-family="'Geist Mono', Consolas, monospace">0.00</text>
  <text x="1040" y="846" font-size="16" fill="#A9A69F" font-family="'Geist Mono', Consolas, monospace">Yape · Plin · Card ⟂</text>
</svg>
